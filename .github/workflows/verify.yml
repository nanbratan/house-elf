# The same gate that runs locally, run again on a clean machine.
#
# `bun run verify` is the whole check: types, lint, format, unit + integration tests
# with coverage thresholds, and both builds. E2E runs after it, because it needs the
# browsers and a dev server and there is no point paying for either if verify fails.

name: verify

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # pgvector, not stock postgres: the integration tests assert the extension is
      # installable, which is the whole reason this database exists.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: houseelf
          POSTGRES_PASSWORD: houseelf
          POSTGRES_DB: houseelf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U houseelf -d houseelf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # No .env file in CI. The integration-test loader treats the file as optional
      # and reads the environment, so setting the variables here is enough.
      DATABASE_URL: postgres://houseelf:houseelf@localhost:5432/houseelf_test
      TEST_DATABASE_URL: postgres://houseelf:houseelf@localhost:5432/houseelf_test
      AGENT_GENERAL_MODEL: anthropic/claude-haiku-4-5

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Bun's global module cache: makes `bun install` a copy rather than a download.
      # Keyed on the lockfile, so a dependency change misses and everything else hits.
      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The tool caches: ESLint's `.eslintcache`, Prettier's under node_modules/.cache,
      # tsc's `*.tsbuildinfo`, and Vite's transform cache. Restored by branch, falling
      # back to whatever ran last, so a typical push re-checks only what it changed.
      # The lockfile is in the key because a plugin upgrade can add rules without
      # changing any config that ESLint hashes.
      - name: Cache incremental tool state
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache
            .eslintcache
            tsconfig.tsbuildinfo
          key: tools-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            tools-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.ref_name }}-
            tools-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Verify
        run: bun run verify

  # A separate job, not a step after `verify`. E2E shares no state with it and is the
  # longest pole — browsers, a build and a dev server — so queueing it behind the
  # other checks only adds its cost to the wall clock. Both jobs must pass.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cached by version so a browser download only happens when Playwright moves.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: E2E
        run: bun run test:e2e

      - name: Upload E2E report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
