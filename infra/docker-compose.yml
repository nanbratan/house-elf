# Local Postgres for house-elf.
#
# Two instances:
#   postgres       — dev data, port 5432, persisted in a named volume
#   postgres-test  — integration tests, port 5433, tmpfs so it resets on restart
#
# Credentials here are local-only and deliberately not secret; nothing in this file
# is used in production (M6 adds a separate production compose). The connection
# strings that the apps read live in .env — see .env.example.

name: house-elf

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: house-elf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: houseelf
      POSTGRES_PASSWORD: houseelf
      POSTGRES_DB: houseelf
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U houseelf -d houseelf"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-test:
    image: pgvector/pgvector:pg17
    container_name: house-elf-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: houseelf
      POSTGRES_PASSWORD: houseelf
      POSTGRES_DB: houseelf_test
    ports:
      - "5433:5432"
    # Disposable: data lives in RAM and is gone the moment the container stops,
    # so every test run starts from a clean database with no volume to prune.
    tmpfs:
      - /var/lib/postgresql/data
    # Durability is worthless for a throwaway test database; trading it for speed.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U houseelf -d houseelf_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
