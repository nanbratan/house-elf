# Git hooks. Installed by `bun install` via the root `prepare` script.
#
# Every job here runs a script from a package.json — the hooks decide *when* and over
# *what*, never *how*. There is one definition of how to lint this repo and it is not
# in this file.
#
# Escape hatch: `LEFTHOOK=0 git commit …`. Pre-push still catches you, and CI after
# that.
#
# core.hooksPath is set to .beads/hooks, bd's recommended location for a Dolt-backed
# install. The hook files themselves are generated, not committed — they are build
# output of two installers, and a tracked copy only ever drifts from what the next
# `bun install` writes. So a fresh clone has NO gate until `bun install` runs; that is
# the first command in any setup, and CI runs the same checks regardless. Lefthook
# treats any custom hooksPath as unsupported without --force, and without
# no_auto_install it retries — and fails the same way — on every single hook run once
# lefthook.yml drifts from its last-synced checksum, which prints the "Skipping hook
# sync" warning on every commit forever after. `scripts/install-hooks.sh` does the
# actual sync (`lefthook install --force` then `bd hooks install --beads`, which
# re-attaches the Beads block lefthook just overwrote); this flag just stops the
# doomed-to-fail auto-retry from running, and re-running it manually never happens.
#
# That script also re-arms the gate afterwards. Beads appends its block *after*
# lefthook's `call_lefthook` line, which silently made lefthook's exit code stop
# reaching git — the jobs below ran, printed their failures, and the commit went
# through regardless (house-elf-8nf). Read it before changing how hooks install.
no_auto_install: true

pre-commit:
  parallel: true
  jobs:
    # Scoped to staged files, because a commit is the staged tree — unrelated work in
    # progress elsewhere should not block it. Both tools take a file list, so the
    # scripts are reused as-is with the paths appended.
    #
    # Caches: Prettier's default (node_modules/.cache/prettier), ESLint's default
    # (.eslintcache), both git-ignored. `--cache-strategy content` beats the default
    # `metadata` — a cache an mtime can fool does not belong in front of a commit.
    - name: format
      glob: '*.{ts,tsx,js,jsx,mjs,json,jsonc,css,md,yml,yaml,html}'
      run: bun run format:check {staged_files}

    - name: lint
      glob: '*.{ts,tsx,js,jsx,mjs}'
      run: bun run lint {staged_files}

    # `vitest related` runs only the tests that import the staged files, directly or
    # transitively. `root:` both filters the staged list to that workspace and runs
    # there.
    - name: test-server
      root: apps/server/
      glob: '*.ts'
      run: bun run test:related {staged_files}

    - name: test-web
      root: apps/web/
      glob: '*.{ts,tsx}'
      run: bun run test:related {staged_files}

# `bun run verify`, decomposed — but split by workspace, not by stage.
#
# The stages are not independent: `check`, `test` and `build` can each touch
# generated files a workspace's tooling writes to disk (route-tree codegen, coverage
# reports), and running two processes against the same workspace concurrently risks
# them racing on those files. Within a workspace those stages are therefore piped;
# across workspaces, and against lint and format, nothing is shared.
#
# `--filter` rather than `root:`, because `root:` scopes the staged file list but does
# not make `bun run` resolve that workspace's package.json — it found the root one and
# fanned back out over every workspace, which is what caused the coverage collision.
#
# The per-workspace jobs only run when that workspace could have broken: a web-only
# push does not build the server, and a docs-only push builds nothing. The shared
# inputs are repeated in each list rather than factored out — YAML cannot concatenate
# sequences, and every way of avoiding the repetition was harder to read than the
# repetition. Six lines, changed about once a year.
#
# `lint`, `format` and the root `tsc` are unscoped; together they cost under two
# seconds and narrowing them would only add ways to miss something.
#
# CI runs `bun run verify` itself, which is serial and unscoped, so the full gate is
# still enforced somewhere unconditional.
pre-push:
  parallel: true
  jobs:
    # Issues live in a Dolt database that git does not track — `.beads/embeddeddolt/`
    # is ignored, and `bd`'s own backup is local-only, so without this the issues
    # never leave the machine. Pushing them alongside the code is the natural pairing:
    # one sync per unit of work, rather than a network round-trip on every
    # `bd create`.
    #
    # Deliberately not `fail: false`. A silent sync failure is how the two halves
    # drift apart, and the recovery — someone else's clone missing a week of issues —
    # is far worse than a push you have to retry. `LEFTHOOK=0 git push` is the escape
    # hatch when the Dolt remote is down and the code cannot wait.
    - name: beads
      run: bd dolt push

    - name: format
      run: bun run format:check .

    - name: lint
      run: bun run lint

    - name: types
      run: bunx tsc --noEmit --incremental -p tsconfig.json

    - name: shared
      glob:
        - 'packages/**'
        - 'package.json'
        - 'bun.lock'
        - 'tsconfig.base.json'
      run: bun run --filter '@house-elf/shared' check

    - name: web
      glob:
        - 'apps/web/**'
        - 'packages/**'
        - 'package.json'
        - 'bun.lock'
        - 'tsconfig.base.json'
        - 'vitest.shared.ts'
      group:
        piped: true
        jobs:
          - name: check
            run: bun run --filter '@house-elf/web' check
          - name: test
            run: bun run --filter '@house-elf/web' test
          - name: build
            run: bun run --filter '@house-elf/web' build

    - name: server
      glob:
        - 'apps/server/**'
        - 'packages/**'
        - 'package.json'
        - 'bun.lock'
        - 'tsconfig.base.json'
        - 'vitest.shared.ts'
      group:
        piped: true
        jobs:
          - name: check
            run: bun run --filter '@house-elf/server' check
          - name: test
            run: bun run --filter '@house-elf/server' test
          - name: build
            run: bun run --filter '@house-elf/server' build
